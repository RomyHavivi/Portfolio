<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="רומי חביבי — בימוי, עריכה וצילום. תיק עבודות יצירתי." />
    <meta name="theme-color" content="#fbf6f1" />
    <title>רומי חביבי — בימוי / עריכה / צילום</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">דילוג לתוכן</a>
    <header class="site-header">
      <a class="wordmark" href="#home" aria-label="רומי חביבי — דף הבית">רומי חביבי</a>
      <nav aria-label="ניווט ראשי">
        <a href="#projects">עבודות</a><a href="#about">קצת עליי</a
        ><a href="#contact" class="nav-contact">בואו נדבר <span aria-hidden="true">↖</span></a>
        <a
          class="nav-instagram"
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="אינסטגרם"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5.25" />
            <circle cx="12" cy="12" r="4.1" />
            <circle class="instagram-flash" cx="17.7" cy="6.6" r="1" />
          </svg>
        </a>
      </nav>
    </header>
    <div class="load-state section-pad no-script-message" hidden>
      <h1 data-noscript-heading>כדי לראות את תיק העבודות</h1>
      <p data-noscript-help>
        יש להפעיל JavaScript בדפדפן. הוא מאפשר מעבר בין העמודים, סינון תמונות והפעלת סרטונים.
      </p>
    </div>
    <noscript><style>.no-script-message { display: block !important; }</style></noscript>
    <main id="main" tabindex="-1">
    </main>
    <footer class="site-footer">
      <a class="wordmark" href="#home">רומי חביבי</a><span>בימוי / עריכה / צילום</span>
      <div><span id="copyright"></span><a href="#admin">ניהול האתר</a></div>
    </footer>
    <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
      <button class="viewer-close" aria-label="סגירה">✕</button>
      <div id="viewer-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <form
      name="portfolio-contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="website"
      hidden
    >
      <input type="hidden" name="form-name" value="portfolio-contact" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
      <input name="website" />
    </form>
    <script type="module" src="./app.js"></script>
  </body>
</html>
